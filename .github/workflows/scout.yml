name: job-scout

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"   # scan every 6 hours (UTC): 05:17 / 11:17 / 17:17 / 23:17 Israel winter time
    - cron: "47 1 * * 0"           # weekly ATS discovery for still-unresolved companies (Sunday 03:47 Israel)
  workflow_dispatch:
    inputs:
      discover:
        description: "Re-run ATS discovery for unresolved companies"
        type: boolean
        default: false
      jsearch:
        description: "Include JSearch (costs API requests)"
        type: boolean
        default: true
      diagnose:
        description: "Diagnose only: a URL or company name (several separated by |); skips the scan"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose
        if: ${{ github.event.inputs.diagnose != '' }}
        run: python -m scout.main diagnose --diagnose "${{ github.event.inputs.diagnose }}" 2>&1 | tee data/diagnose.txt

      - name: Discover ATS boards
        if: ${{ github.event.inputs.diagnose == '' && (github.event.inputs.discover == 'true' || github.event.schedule == '47 1 * * 0' || hashFiles('data/watchlist.resolved.json') == '') }}
        run: python -m scout.main discover

      - name: Scan
        if: ${{ github.event.inputs.diagnose == '' && github.event.schedule != '47 1 * * 0' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # JSearch once a day (the 03:17 UTC scheduled run) or when dispatched manually with jsearch=true
          JSEARCH_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.jsearch == 'true' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$JSEARCH_RUN" = "true" ] || { [ "$EVENT_NAME" = "schedule" ] && [ "$HOUR" = "03" ]; }; then
            python -m scout.main scan
          else
            python -m scout.main scan --no-jsearch
          fi

      - name: Commit data
        run: |
          git config user.name "job-scout"
          git config user.email "job-scout@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scout: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
